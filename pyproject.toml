[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-enhancer"
version = "0.2.0"
description = "Locally enhance video resolution and frame rate with Real-ESRGAN and RIFE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scenedetect[opencv]>=0.6.3",
    "rich>=13",
    "imageio-ffmpeg>=0.4.9",
    "gdown>=5.2.0",
    "spandrel>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

[project.scripts]
enhancer = "enhancer.main:main"

[tool.mypy]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "scenedetect", "scenedetect.*", "spandrel", "spandrel.*"]
ignore_missing_imports = true

[tool.black]
line-length = 120
skip-magic-trailing-comma = false
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.setuptools.packages.find]
where = ["src"]
