name: Set up development environment
description: Install Python and the project's development dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --upgrade pip
    - shell: bash
      run: python -m pip install -e ".[dev]"
